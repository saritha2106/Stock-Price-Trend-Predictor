<!DOCTYPE html>
<html>
<head>
    <title>Stock Price Trend Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 50%;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1a1a1a;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        label {
            font-weight: bold;
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        .result, .error, .info {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
        }
        .result {
            background-color: #e6ffe6;
            color: green;
            border-left: 5px solid green;
        }
        .fall {
            background-color: #fff0e6;
            color: #d35400;
            border-left: 5px solid #d35400;
        }
        .error {
            background-color: #ffe6e6;
            color: red;
            border-left: 5px solid red;
        }
        .info {
            background-color: #eaf2ff;
            color: #003d99;
            border-left: 5px solid #3399ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stock Price Trend Predictor</h1>
        <form method="post">
            {% csrf_token %}
            <label>Open Price:</label>
            <input type="text" name="open" required>

            <label>High Price:</label>
            <input type="text" name="high" required>

            <label>Low Price:</label>
            <input type="text" name="low" required>

            <label>Close Price:</label>
            <input type="text" name="close" required>

            <label>Volume:</label>
            <input type="text" name="volume" required>

            <input type="submit" value="Predict">
        </form>

        {% if message %}
            <div class="error">{{ message }}</div>
        {% endif %}

        {% if prediction %}
            <div class="result {% if prediction == 'Fall' %}fall{% endif %}">
                Prediction: <strong>{{ prediction }}</strong><br>
                Accuracy: {{ accuracy }}
            </div>
        {% endif %}

        {% if explanation %}
            <div class="info">{{ explanation }}</div>
        {% endif %}
    </div>
</body>
</html>
